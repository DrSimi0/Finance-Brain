[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-brain"
version = "0.1.0"
description = "Finance Lab: cerebro cuantitativo por departamentos (datos, investigación, validación, ejecución, monitoreo)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Propietario" }
dependencies = [
    "alpaca-py>=0.45,<1",        # Datos + cuenta Alpaca (Departamento de Datos / Ejecución)
    "vectorbt>=1.2,<2",          # Motor de backtest/validación
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",               # Almacén Parquet
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Capa de agentes IA. TradingAgents no está en PyPI: se instala desde su repo,
# fijado a v0.7.1 (última versión en Python; desde v1.0 es una app Node/TypeScript
# sin binario para Windows). Ver docs/decisiones.md.
agentes = [
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@v0.7.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
finance-brain = "finance_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "B905"]  # ModeloCostos() inmutable como default; zip de producto cartesiano
